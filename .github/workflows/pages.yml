name: Deploy site to GitHub Pages

# Publishes the static site in site/ to GitHub Pages.
#
# Nothing is published until Pages is turned on for the repository: until then
# this workflow stops on "Get Pages site failed", on purpose. To go live, set
# Settings > Pages > Source: GitHub Actions, then push or run it by hand.

on:
  push:
    branches: [website]
    paths:
      - 'site/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deploy finish, queue at most one more.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
