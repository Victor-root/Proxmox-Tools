<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>demo host</title>
<style>
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; overflow: hidden; background: #202124;
    font: 12px/1 "Segoe UI", system-ui, -apple-system, "Helvetica Neue", Arial, sans-serif; }
#chrome { position: absolute; inset: 0 0 auto 0; height: 76px; background: #202124; }
#tabs { display: flex; align-items: flex-end; gap: 2px; height: 38px; padding: 0 8px; }
.tab { position: relative; display: flex; align-items: center; gap: 8px; width: 236px; height: 32px;
    padding: 0 10px 0 12px; border-radius: 9px 9px 0 0; color: #bdc1c6; }
.tab.active { background: #35363a; color: #e8eaed; }
.tab img { width: 16px; height: 16px; flex: none; }
.tab span { flex: 1; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
.tab i { width: 16px; height: 16px; flex: none; opacity: .7; background:
    linear-gradient(45deg, transparent 46%, currentColor 46%, currentColor 54%, transparent 54%),
    linear-gradient(-45deg, transparent 46%, currentColor 46%, currentColor 54%, transparent 54%);
    background-size: 9px 9px; background-repeat: no-repeat; background-position: center; }
.tab.fresh { animation: grow .28s ease-out; }
@keyframes grow { from { width: 40px; opacity: 0; } to { width: 236px; opacity: 1; } }
#bar { display: flex; align-items: center; gap: 10px; height: 38px; padding: 0 10px; background: #35363a; }
.nav { width: 16px; height: 16px; border: 2px solid #9aa0a6; border-width: 0 0 2px 2px; transform: rotate(45deg); margin: 0 6px; opacity: .8; }
.nav.fwd { transform: rotate(-135deg); opacity: .35; }
#omni { flex: 1; display: flex; align-items: center; gap: 8px; height: 28px; padding: 0 14px; border-radius: 14px;
    background: #202124; color: #e8eaed; font-size: 13px; white-space: nowrap; overflow: hidden; }
#omni b { font-weight: 400; color: #9aa0a6; }
#badge { display: none; align-items: center; gap: 7px; height: 24px; padding: 0 11px; border-radius: 12px;
    font-size: 12px; font-weight: 600; color: #e8eaed; background: #4a4d52; white-space: nowrap; }
#badge.on { display: flex; }
#badge.script { background: #e57000; color: #fff; }
#badge::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: currentColor; opacity: .85; }
#pages { position: absolute; inset: 76px 0 0 0; background: #fff; }
/* background tabs keep their size, like in a real browser */
#pages iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; visibility: hidden; }
#pages iframe.active { visibility: visible; }
#popup { position: absolute; display: none; border-radius: 8px; overflow: hidden; background: #35363a;
    box-shadow: 0 18px 50px rgba(0,0,0,.55), 0 0 0 1px rgba(255,255,255,.08); }
#popup .title { height: 30px; display: flex; align-items: center; padding: 0 12px; color: #e8eaed; gap: 8px; }
#popup .title img { width: 14px; height: 14px; }
#popup iframe { border: 0; display: block; background: #101010; }
#cursor { position: absolute; left: 0; top: 0; width: 22px; height: 22px; z-index: 50; pointer-events: none;
    display: none; filter: drop-shadow(0 1px 1.5px rgba(0,0,0,.45)); }
#ring { position: absolute; z-index: 49; width: 34px; height: 34px; margin: -17px 0 0 -17px; border-radius: 50%;
    border: 3px solid #e57000; pointer-events: none; opacity: 0; }
#ring.go { animation: ring .45s ease-out; }
@keyframes ring { from { transform: scale(.4); opacity: .9; } to { transform: scale(1.4); opacity: 0; } }
</style>
</head>
<body>
<div id="chrome">
    <div id="tabs"></div>
    <div id="bar">
        <span class="nav"></span><span class="nav fwd"></span>
        <div id="omni"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#9aa0a6" stroke-width="2.2"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg><span id="url"></span></div>
        <div id="badge"></div>
    </div>
</div>
<div id="pages"></div>
<div id="popup"><div class="title"><img src="/pve2/images/logo-128.png"><span id="popup-title"></span></div></div>
<div id="ring"></div>
<svg id="cursor" viewBox="0 0 24 24"><path d="M5 2.5v17.2l4.3-4.1 2.7 6.2 3.1-1.4-2.7-6.1 5.9-.4z" fill="#fff" stroke="#111" stroke-width="1.3" stroke-linejoin="round"/></svg>
<script>
(function () {
    const tabsEl = document.getElementById('tabs');
    const pages = document.getElementById('pages');
    const tabs = [];
    let active = -1;

    // window.open() of a page is answered by the frame: a new tab, or a
    // separate window when the page asks for one with a size
    function hook(frame) {
        frame.addEventListener('load', () => {
            const win = frame.contentWindow;
            win.open = (url, name, features) => {
                if (features && /width|height/.test(features)) {
                    const w = +(/(?:innerWidth|width)=(\d+)/i.exec(features) || [0, 800])[1];
                    const h = +(/(?:innerheight|height)=(\d+)/i.exec(features) || [0, 420])[1];
                    window.__demo.popup(new URL(url, win.location.href).href, w, h);
                } else {
                    window.__demo.openTab(new URL(url, win.location.href).href, true);
                }
                return { focus() {} };
            };
        });
    }

    function render() {
        tabsEl.innerHTML = '';
        tabs.forEach((t, i) => {
            const el = document.createElement('div');
            el.className = 'tab' + (i === active ? ' active' : '') + (t.fresh ? ' fresh' : '');
            t.fresh = false;
            el.innerHTML = '<img src="/pve2/images/logo-128.png"><span></span><i></i>';
            el.querySelector('span').textContent = t.title;
            el.addEventListener('mousedown', () => { active = i; render(); });
            tabsEl.appendChild(el);
            t.frame.classList.toggle('active', i === active);
        });
    }

    function sync() {
        let changed = false;
        tabs.forEach((t) => {
            let title = t.title;
            try { title = t.frame.contentDocument.title || title; } catch (e) {}
            if (title !== t.title) { t.title = title; changed = true; }
        });
        if (changed) render();
        const t = tabs[active];
        if (t) {
            try {
                const loc = t.frame.contentWindow.location;
                document.getElementById('url').innerHTML = 'pve01<b>:8006' + (loc.pathname + loc.search + loc.hash).replace(/&/g, '&amp;').replace(/</g, '&lt;') + '</b>';
            } catch (e) {}
        }
    }
    setInterval(sync, 100);

    const cursor = document.getElementById('cursor');
    const ring = document.getElementById('ring');
    window.__demo = {
        openTab(url, focus) {
            const frame = document.createElement('iframe');
            hook(frame);
            frame.src = url;
            pages.appendChild(frame);
            tabs.push({ frame, title: '', fresh: true });
            if (focus || active < 0) active = tabs.length - 1;
            render();
            return tabs.length - 1;
        },
        frame(i) { return tabs[i === undefined ? active : i].frame; },
        badge(text, script) {
            const b = document.getElementById('badge');
            b.textContent = text || '';
            b.className = text ? 'on' + (script ? ' script' : '') : '';
        },
        popup(url, w, h) {
            const box = document.getElementById('popup');
            box.querySelectorAll('iframe').forEach((f) => f.remove());
            const frame = document.createElement('iframe');
            frame.style.width = w + 'px';
            frame.style.height = h + 'px';
            frame.src = url;
            box.appendChild(frame);
            box.style.left = Math.round((innerWidth - w) / 2 + 60) + 'px';
            box.style.top = Math.round((innerHeight - h - 30) / 2 + 40) + 'px';
            box.style.display = 'block';
            const t = () => { try { document.getElementById('popup-title').textContent = frame.contentDocument.title; } catch (e) {} };
            setInterval(t, 100);
        },
        closePopup() { document.getElementById('popup').style.display = 'none'; },
        cursor(x, y) {
            cursor.style.display = 'block';
            cursor.style.transform = 'translate(' + (x - 5) + 'px,' + (y - 2) + 'px)';
        },
        hideCursor() { cursor.style.display = 'none'; },
        ripple(x, y) {
            ring.style.left = x + 'px';
            ring.style.top = y + 'px';
            ring.classList.remove('go');
            void ring.offsetWidth;
            ring.classList.add('go');
        },
    };
})();
</script>
</body>
</html>
